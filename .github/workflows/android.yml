
name: Circuit Wizard APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q "untitled (1).zip" -d project

      - name: Build APK
        run: |
          WRAPPER=$(find project -name gradlew -type f | head -1)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found in ZIP"
            exit 1
          fi
          DIR=$(dirname "$WRAPPER")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Circuit-Wizard-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
