name: Circuit Wizard APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract and Build APK
        run: |
          mkdir project
          unzip "untitled (1).zip" -d project
          WRAPPER=$(find project -name gradlew -type f | head -1)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          DIR=$(dirname "$WRAPPER")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Circuit-Wizard-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
